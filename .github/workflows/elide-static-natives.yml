# Elide fork: build the Static-JNI `<classifier>-static` JARs consumed by WHIPLASH.
#
# Produces `.a` archives for musl and glibc on linux-amd64/linux-arm64, plus
# macos-arm64, and uploads each leg's Maven-layout stage tree as an artifact.
# Merge the artifacts and publish with
# `rclone copy stage/ elide:elide-maven/netty/<ver>.<rev>/`.
#
# Linux legs run natively per arch (no QEMU): Alpine edge for musl and Debian
# trixie for glibc. The libc is part of each static JAR classifier so the two
# incompatible ABIs cannot overwrite or be selected in place of one another.
# The macOS leg runs natively against Apple clang.
name: Elide Static Natives

on:
  push:
    branches: ["elide-**"]
  workflow_dispatch:
    inputs:
      tcnative_ref:
        description: "elide-tools/netty-tcnative ref to build against"
        required: false
        default: "elide-2.0.81.Final"

permissions:
  contents: read

env:
  TCNATIVE_REF: ${{ github.event.inputs.tcnative_ref || 'elide-2.0.81.Final' }}
  # Only these modules are consumed downstream. codec-native-quic and
  # resolver-dns-native-macos build but are unused; skipping them avoids the
  # slow and fragile BoringSSL/quiche legs.
  NETTY_MODULES_LINUX: epoll,io_uring
  NETTY_MODULES_MAC: kqueue

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux-amd64-musl
            runner: ubuntu-24.04
            docker_platform: linux/amd64
            image: alpine:edge
            libc: musl
            netty_profile: linux
            tcnative_platform: linux-x86_64
          - leg: linux-amd64-glibc
            runner: ubuntu-24.04
            docker_platform: linux/amd64
            image: debian:trixie-slim
            libc: glibc
            netty_profile: linux
            tcnative_platform: linux-x86_64
          - leg: linux-arm64-musl
            runner: ubuntu-24.04-arm
            docker_platform: linux/arm64
            image: alpine:edge
            libc: musl
            netty_profile: linux-aarch64
            tcnative_platform: linux-aarch64
          - leg: linux-arm64-glibc
            runner: ubuntu-24.04-arm
            docker_platform: linux/arm64
            image: debian:trixie-slim
            libc: glibc
            netty_profile: linux-aarch64
            tcnative_platform: linux-aarch64
    name: ${{ matrix.leg }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout netty fork
        uses: actions/checkout@v5
        with:
          path: netty

      - name: Checkout netty-tcnative fork
        uses: actions/checkout@v5
        with:
          repository: elide-tools/netty-tcnative
          ref: ${{ env.TCNATIVE_REF }}
          path: netty-tcnative

      - name: Init shared cflags submodule
        working-directory: netty
        run: |
          # The submodule URL is SSH; rewrite to HTTPS (elide-dev/cflags is public).
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init static-jni/cflags
          ls -l static-jni/cflags/

      - name: Check NETTY_JNI_ALIAS coverage
        run: |
          python3 netty/static-jni/scripts/check-jni-aliases.py \
            --netty-dir netty --tcnative-dir netty-tcnative

      - name: Build netty transports (${{ matrix.netty_profile }})
        run: |
          mkdir -p stage m2
          docker run --rm --platform=${{ matrix.docker_platform }} \
            -e NETTY_DIR=/netty -e TCNATIVE_DIR=/netty-tcnative \
            -e STATIC_LIBC=${{ matrix.libc }} \
            -e MODULES_FILTER="$NETTY_MODULES_LINUX" \
            -e VERBOSE=1 \
            -v "$PWD/netty:/netty" \
            -v "$PWD/netty-tcnative:/netty-tcnative" \
            -v "$PWD/stage:/stage" \
            -v "$PWD/m2:/root/.m2" \
            -w /netty --entrypoint /bin/sh ${{ matrix.image }} \
            -c 'if command -v apk >/dev/null 2>&1; then apk add --no-cache --quiet bash; fi; /netty/static-jni/scripts/stage-natives.sh /stage ${{ matrix.netty_profile }} --prep-deps'

      - name: Build netty-tcnative boringssl-static (${{ matrix.tcnative_platform }})
        run: |
          docker run --rm --platform=${{ matrix.docker_platform }} \
            -e NETTY_DIR=/netty -e TCNATIVE_DIR=/netty-tcnative \
            -e STATIC_LIBC=${{ matrix.libc }} \
            -e VERBOSE=1 \
            -v "$PWD/netty:/netty" \
            -v "$PWD/netty-tcnative:/netty-tcnative" \
            -v "$PWD/stage:/stage" \
            -v "$PWD/m2:/root/.m2" \
            -w /netty --entrypoint /bin/sh ${{ matrix.image }} \
            -c 'if command -v apk >/dev/null 2>&1; then apk add --no-cache --quiet bash; fi; /netty/static-jni/scripts/stage-natives-tcnative.sh /stage ${{ matrix.tcnative_platform }} --prep-deps'

      - name: Normalise ownership
        run: sudo chown -R "$(id -u):$(id -g)" stage

      - name: Check archive object format
        run: python3 netty/static-jni/scripts/check-archive-format.py --os linux stage

      - name: Summarise staged artifacts
        run: |
          find stage -name '*-${{ matrix.libc }}-static.jar' | sort
          test "$(find stage -name '*-${{ matrix.libc }}-static.jar' | wc -l)" -eq 3

      - name: Upload stage tree
        uses: actions/upload-artifact@v4
        with:
          name: stage-${{ matrix.leg }}
          path: stage/
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    name: macos-arm64
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout netty fork
        uses: actions/checkout@v5
        with:
          path: netty

      - name: Checkout netty-tcnative fork
        uses: actions/checkout@v5
        with:
          repository: elide-tools/netty-tcnative
          ref: ${{ env.TCNATIVE_REF }}
          path: netty-tcnative

      - name: Init shared cflags submodule
        working-directory: netty
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init static-jni/cflags
          ls -l static-jni/cflags/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install native toolchain deps
        run: |
          brew bundle --file=netty-tcnative/Brewfile
          # tcnative's mac profile hard-codes /opt/homebrew/opt/openssl@<ver>/include
          # (openssl.lib.version=3.6); Homebrew's `openssl` formula lands at
          # openssl@3. Alias it so the path resolves if a module reads it.
          ver="$(sed -n 's|.*<openssl.lib.version>\(.*\)</openssl.lib.version>.*|\1|p' netty-tcnative/pom.xml | head -1)"
          if [ -n "$ver" ] && [ ! -e "/opt/homebrew/opt/openssl@${ver}" ] && [ -e /opt/homebrew/opt/openssl@3 ]; then
            ln -sfn /opt/homebrew/opt/openssl@3 "/opt/homebrew/opt/openssl@${ver}"
          fi

      - name: Check NETTY_JNI_ALIAS coverage
        run: |
          python3 netty/static-jni/scripts/check-jni-aliases.py \
            --netty-dir netty --tcnative-dir netty-tcnative

      - name: Build netty transports (mac)
        env:
          MODULES_FILTER: ${{ env.NETTY_MODULES_MAC }}
          VERBOSE: "1"
        run: |
          mkdir -p "$PWD/stage"
          netty/static-jni/scripts/stage-natives.sh "$PWD/stage" mac --prep-deps
        # NETTY_DIR resolves to the netty/ checkout via the script's grandparent rule.

      - name: Build netty-tcnative boringssl-static (mac-aarch64)
        env:
          TCNATIVE_DIR: ${{ github.workspace }}/netty-tcnative
          VERBOSE: "1"
        run: netty/static-jni/scripts/stage-natives-tcnative.sh "$PWD/stage" mac-aarch64 --prep-deps

      # The decisive macOS gate: bitcode members mean ThinLTO internalised the
      # NETTY_JNI_ALIAS implementations and the Mach-O `.set` aliases dangle,
      # which only surfaces as a dyld `Symbol not found` in a downstream image.
      - name: Check archive object format
        run: python3 netty/static-jni/scripts/check-archive-format.py --os darwin stage

      - name: Summarise staged artifacts
        run: find stage -name '*-static.jar' | sort

      - name: Upload stage tree
        uses: actions/upload-artifact@v4
        with:
          name: stage-macos-arm64
          path: stage/
          if-no-files-found: error
          retention-days: 14
